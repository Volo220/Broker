broker:
  transport:
    grpc:
      publisher:
        max-payload-bytes: 4194304
        max-routing-key-length: 255
        max-headers: 64
        max-header-key-length: 128
        max-header-value-length: 1024
  memory:
    payload:
      mode: HEAP
      inline-threshold-bytes: 256
  aol:
    base-dir: target/test-data/aol
  flow-control:
    enabled: true
    max-block-ms: 0
    resume-batch: 64
    global:
      high-ratio: 0.40
      low-ratio-factor: 0.75
      heap-pressure-threshold: 0.80
      min-free-os-mb: 256
      check-interval-ms: 500