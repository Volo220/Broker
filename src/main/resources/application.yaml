spring:
  application:
    name: broker
  threads:
    virtual:
      enabled: true

broker:
  aol:
    base-dir: data/aol
    sync-ack: false
    max-batch-size: 256
    linger-micros: 1500
    ack-batch-size: 512
    ack-linger-micros: 4000
    
  flow-control:
    enabled: true
    max-block-ms: 0
    resume-batch: 64
    global:
      high-ratio: 0.80
      low-ratio-factor: 0.75
      heap-pressure-threshold: 0.90
      min-free-os-mb: 256
      check-interval-ms: 500

  publisher:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000

  transport:
    grpc:
      publisher:
        max-payload-bytes: 4194304
        max-routing-key-length: 255
        max-headers: 64
        max-header-key-length: 128
        max-header-value-length: 1024

  consumer:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000

  memory:
    payload:
      mode: HEAP
      inline-threshold-bytes: 256

  memory-sampler:
    enabled: true
    sample-interval-ms: 1000
    csv:
      enabled: true
      file-path: logs/memory-metrics.csv
      append: false
    console:
      enabled: true
      interval-seconds: 5
    metrics:
      include-gc: true
      include-direct-memory: true
      include-threads: true
      include-broker-queues: true
